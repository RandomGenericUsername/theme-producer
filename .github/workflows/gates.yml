name: gates

# One job per `make gates` member, so a failure names the gate that broke.
# `make ci-gates-parity` (job `ci-gates-parity`) fails when this file's job set
# and the Makefile's `GATES` set differ in either direction; CI-only jobs are
# declared there with a reason. The Makefile is the authoritative list.
#
# `image` is a declared CI-only job: it builds and smoke-runs the pinned base +
# matugen images. It needs a live container engine and network access, so it is
# not part of `make gates`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true
      - run: make sync
      - run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true
      - run: make sync
      - run: make lint

  hermetic:
    name: hermetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true
      - run: make sync
      - run: make hermetic

  lock-check:
    name: lock-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true
      - run: make lock-check

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docs-check

  ci-gates-parity:
    name: ci-gates-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make ci-gates-parity

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true
      - name: Use the runner's Docker engine
        # ubuntu-latest ships the Docker CLI + daemon; fail here, not inside the
        # build, if that ever changes.
        run: docker version --format '{{.Server.Version}}'
      - name: Build the base + matugen images and smoke-run both
        # The tag is derived from pyproject (`IMAGE_TAG ?= v$(VERSION)`), so a
        # release bump cannot leave this job building a stale tag.
        run: make sync && make image IMAGE_ENGINE=docker
      - name: Smoke-run `tpr generate` inside the matugen image
        run: >-
          TPR_IMAGE_SMOKE=1 IMAGE_ENGINE=docker
          uv run pytest tests/integration/test_image_smoke.py -q -rs
