[package]
name = "tpr-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "theme-producer v2 native engine on the material-colors crate"
publish = false

[[bin]]
name = "tpr-native"
path = "src/main.rs"

[dependencies]
material-colors = { version = "=0.4.2", features = ["image", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
