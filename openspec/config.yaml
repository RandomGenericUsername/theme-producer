schema: spec-driven

# Project context (constraints an agent cannot infer from the code).
context: |
  `theme-producer` (`tpr`) is the theme CLI of the dotfiles CLI toolchain. One package, repo root =
  package root: `src/theme_producer/`, `tests/` at the top level, no nested project roots. Its root
  object is a Theme (Material You semantic roles + tonal palettes + light/dark), not a 16-color
  palette; the ANSI 16 is one projection for terminal-only consumers. Engines sit behind
  `ThemeEnginePort`: v1 `matugen` (pinned release, containerized, JSON only, GPL-2.0-or-later used
  as a separate process only), v2 our own Rust helper on the MIT/Apache-2.0 `material-colors` crate.
  A pure-Python engine is a recorded non-goal until a revisit trigger fires. `color-scheme-generator`
  (CSG) is untouched and remains production until the dotfiles wiring ticket proves replacement.
  This repo owns its Dockerfiles and its `install` build verb; the build context is this repo root
  and the image tag is the pin, never `latest`. It consumes `cli-output`,
  `config-assembler-engine` and `oci-runtime` as immutable git tags, never paths.
  `theme.json` is the canonical artifact; projections are pure functions of it and never read each
  other. The bundled template catalog and `theme.json` schema are public asset surfaces.
  Repo contract in AGENTS.md (CLAUDE.md symlinks there) applies to all artifacts.

# Per-artifact rules (from mu; the evidence rule is not optional).
rules:
  proposal:
    - "Every claim carries Evidence (file path + lines, commit SHA, URL + quote, or prototype command + observed output) and a one-command Verify step; mark Evidence MISSING rather than stating unproven claims as fact."
    - "Always state what is out of scope."
  specs:
    - "Each requirement states its acceptance check (command to run + expected result)."
    - "Cite the source of each requirement (prior-art path, user statement, or prototype output)."
  design:
    - "Include a verification plan - what prototype or test validates each key decision, with exact commands."
    - "No component without an evidence-backed reason to exist."
  tasks:
    - "Each task ends with an observable check (command + expected output); break tasks into chunks of max 2 hours."
