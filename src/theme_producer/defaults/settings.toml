[output]
directory = "/tmp/theme-producer"
default_formats = []
overwrite = false
verbosity = 1
apply_to_terminal = true
default_mode = "dark"
smart_threshold = 0.5

[generation]
engine = "matugen"
default_params = {}
scheme_type = "scheme-tonal-spot"
scheme_policy = "balanced"

[templates]
directory = ""

[runtime]
mode = "local"

[container]
engine = "podman"
image_prefix = "tpr"
image_tag = ""
timeout_seconds = 300
memory_limit = "512m"
